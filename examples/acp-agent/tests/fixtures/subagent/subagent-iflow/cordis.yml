# Test-only composition: the iFlow subagent backend on the real Loader/app path.
# The scripted model delegates once; the scripted fake iFlow CLI (its path is
# machine-absolute, so the driving e2e supplies it via DSH_TEST_IFLOW_FAKE)
# prints a canned final answer on stdout, so end-to-end prompt delivery and
# result plumbing are asserted keylessly.
- id: mock-llm
  name: './mock-delegating-llm.ts'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

# The out-of-process iFlow backend spawns its child through the subprocess seam.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: subagent-iflow
  name: '@deepseek-ai/dsh-subagent-iflow'
  config:
    providerName: iflow
    command: !!js process.env.DSH_TEST_IFLOW_FAKE

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: iflow
    toolName: subagent
    # iFlow advertises no depthLimit: the child CLI owns its own recursion
    # budget, so the local numeric default cannot apply here.
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'Test iFlow subagent delegation.'
    workspaceContext: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
